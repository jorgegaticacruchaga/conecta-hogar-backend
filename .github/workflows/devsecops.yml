name: Pipeline DevSecOps Backend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  sast-semgrep:
    name: 1. SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Escaneo de codigo Java
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/java

  sca-owasp:
    name: 2. SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Ejecutar OWASP Dependency Check mediante Maven
        run: mvn org.owasp:dependency-check-maven:check -Dformat=HTML

  container-trivy:
    name: 3. Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-owasp]
    steps:
      - uses: actions/checkout@v5
      - name: Construir Imagen Docker
        run: docker build -t backend-spring:${{ github.sha }} .
      - name: Escanear Imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend-spring:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'